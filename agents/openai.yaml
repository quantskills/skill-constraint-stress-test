openapi: 3.1.0
info:
  title: skill-constraint-stress-test
  description: AI trader constraint stress test and fault-injection replay. Injects duplicate input, prompt perturbation, missing quotes, and timeout/retry faults, then replays decisions with and without a constraint-validation layer to report violation rate, duplicate-action rate, refusal count, and ARR/RRR/NNT effect sizes.
  version: 0.4.1

x-skill-info:
  name: skill-constraint-stress-test
  type: build
  category: evaluation
  entry: scripts/build.py
  tags: [quant, build, evaluation, fault-injection, stress-test, constraint-check]

x-steps:
  - id: evaluate
    script: scripts/build.py
    description: Run the full constraint stress-test evaluation and emit aggregate statistics
    args:
      cases_dir: "fixtures/"
      output_dir: "output/"
    auth_required: false
    output: "output/report.json, output/events_with_checks.jsonl, output/events_without_checks.jsonl, output/pairwise_comparison.jsonl"

  - id: self_check
    script: scripts/env_check.py
    description: Validate the runtime environment and report blockers as structured JSON
    args: "--self-check --json"
    auth_required: false

  - id: validate_events
    script: scripts/validate.py
    description: Validate a JSONL event log against the event contract
    args: "output/events_with_checks.jsonl --json"
    auth_required: false

  - id: generate_fixtures
    script: scripts/fixture_generator.py
    description: Convert PandaData MCP export JSON into evaluation fixtures (the script itself never goes online)
    args: "--from-mcp mcp_exports/ --date 20251110"
    auth_required: false

x-preflight:
  # Mirror of the "## 前置检查" section in SKILL.md. Work through it in order and
  # stop at the first failing item: report only what is missing, never switch data
  # sources and never degrade silently.
  host: QuantStudio
  stop_on_failure: true
  items:
    - id: runtime
      check: "QuantStudio host with Python >= 3.10 (env_check item python_version)"
      on_fail: stop
    - id: dependencies
      check: "evaluation path is standard-library only; tests need `import pytest`"
      on_fail: stop
    - id: mcp_session
      check: "mcp__pandadata__auth_status -> ok: true and reauth_required: false"
      blocking_when: "generating or refreshing fixtures"
      on_fail: "stop; tell the user to log in via Settings -> PandaData; never ask the user for credentials"
    - id: permission_probe
      check: "one minimal get_trade_list call; data_permission_required means stop"
      blocking_when: "generating or refreshing fixtures"
      on_fail: "relay the returned message and purchase entry point verbatim"
    - id: truncation
      check: "handle truncated / row_count < total_rows before writing any fixture"
      blocking_when: "generating or refreshing fixtures"
      on_fail: stop
    - id: offline_evaluation
      check: "fixtures/ present; mcp_data_source stays ok by design"
      blocking_when: null
      on_fail: "state the fixture source and generation date; built-in numbers are constructed, not fills"
    - id: subject_under_test
      check: "trader=stub proves the pipeline only; temperature 0 and identical comparability fields"
      on_fail: "verdict must stay inconclusive; never report it as AI-trader behaviour"

x-injection-types:
  - duplicate
  - prompt_perturb
  - missing_quote
  - timeout_retry

x-markets:
  - CN_A_STOCK
  - HK_STOCK
  - INDEX_FUTURE
  - COMMODITY_FUTURE
  - CRYPTO

x-outputs:
  - format: json
    path: output/report.json
    description: Aggregate statistics (violation rates, duplicate count, refusal count, ARR/RRR/NNT)
  - format: jsonl
    path: output/events_with_checks.jsonl
    description: Event stream with the constraint layer enabled
  - format: jsonl
    path: output/events_without_checks.jsonl
    description: Event stream without the constraint layer
  - format: jsonl
    path: output/pairwise_comparison.jsonl
    description: Per-event paired comparison

x-evaluation-policy:
  mode: replay-only
  live_trading_access: false
  note: "基于本地 fixture 回放；禁止为触发测试场景真实下单。跨模型比较须固定 model_id/temperature/cases_per_type/injection_types/budget 并计入 config_hash；不同模型结果不得合并。"
  models_under_test:
    - id: stub-trader
      role: subject

x-mcp-source:
  server: pandadata
  transport: streamable-http
  url: https://pandadatamcp.pandaaiquant.com/mcp
  auth: oauth
  tools:
    - mcp__pandadata__auth_status
    - mcp__pandadata__search_methods
    - mcp__pandadata__get_method_doc
    - mcp__pandadata__call_pandadata
  call_order: [auth_status, search_methods, get_method_doc, call_pandadata]
  call_pandadata_params: {method: "<get_* method>", params: {}, preview_rows: 2000}
  methods:
    - method: get_suspended_list
      params: [start_date, end_date, is_suspended, symbol]
      returns: "dataframe: symbol,date,is_suspended"
    - method: get_st_list
      params: [start_date, end_date, is_st, symbol]
      returns: "dataframe: symbol,date,is_st"
    - method: get_trade_list
      params: [date, exchange]
      returns: "list: [{date, symbol}]"
    - method: get_stock_daily
      params: [symbol, start_date, end_date, fields, indicator, st]
      returns: "dataframe: date,symbol,open,high,low,close,pre_close,volume,amount,limit_up,limit_down,trade_status,name"
  truncation_policy: "truncated=true must be rejected; fetch in narrower date ranges via scripts/mcp_source.py"

x-requirements:
  runtime: python >= 3.10
  packages:
    - pyyaml (optional)
    - pytest (dev)
  env: []
  data_source: "PandaData MCP on the QuantStudio host (agent-side); no fetching client, no credentials"